# @package _global_

defaults:
  - /dataset@_group_.mvhn: mvhn
  - override /model/encoder: template_uv_concat_bone
  - override /model/encoder/backbone: croco_multi2
  - override /model/decoder: lbs_splatting_cuda
  - override /loss: [mse, lpips, chamfer, projection, lbs_weights]

wandb:
  name: tpose_res512
  tags: [mvhn, 512x512]

model:
  encoder:
    pose_free: true
    intrinsics_embed_loc: encoder
    intrinsics_embed_type: token
    pretrained_weights: '/workspace/NoPo-Avatar/checkpoint/thuman2.1_inputs3_res1024_iter50000.ckpt'

    apply_mask: "soft"
    direct_rgbs: false

    backbone:
      template_encoder_free: true
      template_image_size: [512, 512]
      intrinsics_embed_loc: "none"
      disable_checkpointing: true
      use_ref_mask: true  # SimVS functionality needs this to be True

  decoder:
    make_scale_invariant: false
    render_no_canonical: false
    render_no_rgb: false
    render_context: true
    warp_by_shape: true

loss:
  chamfer:
    single_directional: false

  lbs_weights:
    weight: 0.01

dataset:
  mvhn:
    # no 'roots' here since we use MVHN directly from PVC
    augment: true
    template_image_shape: [512, 512]
    input_image_shape: [512, 512]
    load_template_uv: true
    load_lbs_weights: true
    background_color: [-1, -1, -1]

    view_sampler:
      num_context_views: 3
      num_target_views: 4
      warm_up_steps: 150_000
    load_inconsistent_images: true  # if enabled, we use inconsistent images for context views for all non-reference views

optimizer:
  lr: 5e-5
  warm_up_steps: 2000
  backbone_lr_multiplier: 0.05

data_loader:
  train:
    batch_size: 1
    num_workers: 2

trainer:
  max_steps: 300_001
  val_check_interval: 1000

checkpointing:
  every_n_train_steps: 5000