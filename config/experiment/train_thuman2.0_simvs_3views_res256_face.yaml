# @package _global_
#
# Command-line overrides (run from repo root, use + to add and ~ to remove):
#
#   # Change dataset path (list: no spaces after commas)
#   python src/main.py experiment=train_thuman2.0_simvs_3views_res256_face dataset.thuman.roots=[/path/to/thuman]
#
#   # Disable faceloss LPIPS or ArcFace weight
#   ... loss.faceloss.lpips.weight=0
#   ... loss.faceloss.arcface.weight=0.1
#
#   # Remove faceloss entirely (override loss list; no spaces)
#   ... loss=[mse,lpips,chamfer,projection,lbs_weights]
#
#   # Remove LPIPS loss entirely
#   ... loss=[mse,chamfer,projection,lbs_weights,faceloss]
#
defaults:
  - /dataset@_group_.thuman: thuman
  - override /model/encoder: template_uv_face
  - override /model/encoder/backbone: croco_uv
  - override /model/decoder: lbs_splatting_cuda
  - override /loss: [mse, lpips, chamfer, projection, lbs_weights, faceloss]

wandb:
  name: tpose_faceencoder_arcface
  tags: [thuman2.1, 256x256]

model:
  encoder:
    pose_free: true
    intrinsics_embed_loc: encoder
    intrinsics_embed_type: token
    pretrained_weights: 'checkpoint/thuman2.1_inputs3_res1024_iter50000.ckpt'

    apply_mask: "soft"
    direct_rgbs: false

    backbone:
      template_encoder_free: true
      template_image_size: [256, 256]
      intrinsics_embed_loc: "none"
      disable_checkpointing: true
      use_ref_mask: true  # SimVS functionality needs this to be True
      use_uv_pe: false

  decoder:
    make_scale_invariant: false
    render_no_canonical: false
    render_no_rgb: false
    render_context: true
    warp_by_shape: true

loss:
  chamfer:
    single_directional: false

  lbs_weights:
    weight: 0.01

  mse:
    apply_mask: true

  faceloss:
    mse:
      weight: 1.0
    lpips:
      weight: 0.1
      apply_after_step: 0
    arcface:
      weight: 0.0


dataset:
  thuman:
    roots: [datasets/thuman2.1_lbm]
    augment: true
    template_image_shape: [256, 256]
    original_image_shape: [1024, 1024]
    input_image_shape: [256, 256]
    load_template_uv: true
    load_lbs_weights: true
    background_color: [-1, -1, -1]

    view_sampler:
      num_context_views: 3
      num_target_views: 4
      warm_up_steps: 150_000

    ## SimVS needs this to be True
    load_inconsistent_images: true  # if enabled, we use inconsistent images for context views for all non-reference views
    crop_annotations_path: null
    consistent_set_prob: 0.20

optimizer:
  lr: 1e-4
  warm_up_steps: 2000
  backbone_lr_multiplier: 0.1

data_loader:
  train:
    batch_size: 4
    num_workers: 2

trainer:
  max_steps: 300_001
  val_check_interval: 1000

checkpointing:
  every_n_train_steps: 10000