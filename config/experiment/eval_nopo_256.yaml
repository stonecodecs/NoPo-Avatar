# @package _global_
# Base eval config for 256×256 resolution checkpoints (template_uv_concat_bone encoder).
# Dataset roots, checkpoints, and variant flags (IC / crop / varypose) are injected
# by run_eval.py so this YAML only captures the model architecture.

defaults:
  - /dataset@_group_.thuman: thuman
  - override /model/encoder: template_uv_concat_bone
  - override /model/encoder/backbone: croco_multi2
  - override /model/decoder: lbs_splatting_cuda
  - override /loss: [mse, lpips, chamfer, projection, lbs_weights]

wandb:
  name: eval_nopo_256
  tags: [eval, 256x256]

model:
  encoder:
    pose_free: true
    intrinsics_embed_loc: encoder
    intrinsics_embed_type: token
    pretrained_weights: null

    apply_mask: "soft"
    direct_rgbs: false

    backbone:
      template_encoder_free: true
      template_image_size: [1024, 1024]
      use_ref_mask: false
      intrinsics_embed_loc: "none"
      disable_checkpointing: true

  decoder:
    make_scale_invariant: false
    render_no_canonical: false
    render_no_rgb: false
    render_context: true
    warp_by_shape: true

loss:
  chamfer:
    single_directional: false

  lbs_weights:
    weight: 0.01

dataset:
  thuman:
    # roots / index_path / background_color injected by run_eval.py
    augment: false
    template_image_shape: [1024, 1024]
    input_image_shape: [256, 256]
    original_image_shape: [1024, 1024]
    load_template_uv: true
    load_lbs_weights: false
    # variant flags — overridden by run_eval.py per experiment
    load_inconsistent_images: false
    vary_poses: false

    view_sampler:
      num_context_views: 3
      num_target_views: 4
      warm_up_steps: 150_000

optimizer:
  lr: 1e-4
  warm_up_steps: 2000
  backbone_lr_multiplier: 0.1

data_loader:
  train:
    batch_size: 1
    num_workers: 4
  test:
    num_workers: 1

trainer:
  max_steps: 300_001
  val_check_interval: 1000

checkpointing:
  every_n_train_steps: 10000
