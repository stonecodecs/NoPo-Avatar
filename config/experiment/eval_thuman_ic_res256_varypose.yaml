# @package _global_

defaults:
  - /dataset@_group_.thuman: thuman
  - override /model/encoder: template_uv_concat_bone
  - override /model/encoder/backbone: croco_multi2
  - override /model/decoder: lbs_splatting_cuda
  - override /loss: [mse, lpips, chamfer, projection, lbs_weights]

wandb:
  name: tpose_res256_ic_varypose
  tags: [thuman2.1, 256x256, inconsistent]

model:
  encoder:
    pose_free: true
    intrinsics_embed_loc: encoder
    intrinsics_embed_type: token
    pretrained_weights: '/workspace/NoPo-Avatar/checkpoint/thuman2.1_inputs3_res1024_iter50000.ckpt'

    apply_mask: "soft"
    direct_rgbs: false

    backbone:
      template_encoder_free: true
      template_image_size: [1024, 1024]
      use_ref_mask: false
      intrinsics_embed_loc: "none"
      disable_checkpointing: true

  decoder:
    make_scale_invariant: false
    render_no_canonical: false
    render_no_rgb: false
    render_context: true
    warp_by_shape: true

loss:
  chamfer:
    single_directional: false

  lbs_weights:
    weight: 0.01

dataset:
  thuman:
    roots: [/workspace/humanvol/thuman2.1_id_vtx]
    augment: false
    template_image_shape: [1024, 1024]
    input_image_shape: [256, 256]
    load_template_uv: true
    load_lbs_weights: false
    background_color: [-1, -1, -1]
    load_inconsistent_images: true
    vary_poses: true

    view_sampler:
      name: 'uniform'
      num_context_views: 3
      num_target_views: 4
      warm_up_steps: 150_000

optimizer:
  lr: 1e-4
  warm_up_steps: 2000
  backbone_lr_multiplier: 0.1

data_loader:
  train:
    batch_size: 1
    num_workers: 8

trainer:
  max_steps: 300_001
  val_check_interval: 1000

checkpointing:
  every_n_train_steps: 10000
