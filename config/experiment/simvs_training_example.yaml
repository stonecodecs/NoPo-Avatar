# Example experiment configuration for SimVS-style training with NoPo-Avatar
# This shows how to configure the full training pipeline with inconsistent views

defaults:
  - /model/encoder: noposplat
  - /model/decoder: splatting_cuda
  - /dataset: thuman_simvs_example  # Use the SimVS-enabled dataset config
  - /loss: [mse, lpips, ssim, projection]  # Include projection loss for geometric consistency

wandb:
  project: noposplat_simvs
  entity: your-entity-name  # Update with your wandb entity
  name: simvs_training_example
  mode: online  # or "disabled" to disable wandb

mode: train

data_loader:
  train:
    num_workers: 4
    persistent_workers: true
    batch_size: 2
    seed: 1234
  test:
    num_workers: 1
    persistent_workers: false
    batch_size: 1
    seed: 2345
  val:
    num_workers: 1
    persistent_workers: true
    batch_size: 1
    seed: 3456

optimizer:
  lr: 1.5e-4
  warm_up_steps: 2000
  backbone_lr_multiplier: 0.1

checkpointing:
  load: null  # Set to checkpoint path to resume training
  every_n_train_steps: 5000
  save_top_k: -1
  save_weights_only: false

train:
  depth_mode: null
  extended_visualization: false
  print_log_every_n_steps: 10
  log_every_n_steps: 1000
  distiller: ''
  distill_max_steps: 1000000

test:
  output_path: outputs/test
  align_pose: false
  pose_align_steps: 400
  rot_opt_lr: 0.005
  trans_opt_lr: 0.005
  align_human_pose: disabled
  human_rot_opt_lr: 0.0005
  human_trans_opt_lr: 0.0005
  compute_scores: true
  save_image: true
  save_video: false
  save_compare: false
  save_canonical: false
  save_gaussians: false
  save_lbs_weights: false
  pose_seq: null
  optim_pose: false

seed: 111123

trainer:
  max_steps: -1  # Set to specific number of steps or -1 for unlimited
  val_check_interval: 250
  gradient_clip_val: 0.5
  num_nodes: 1
  accumulate_grad_batches: 1

hydra:
  run:
    dir: outputs/simvs_exp_${wandb.name}/${now:%Y-%m-%d_%H-%M-%S}
