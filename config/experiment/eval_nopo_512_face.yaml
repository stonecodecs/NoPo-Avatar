# @package _global_
# Base eval config for 512×512 resolution checkpoints (template_uv_face encoder,
# SimVS with face crop supervision).
# Dataset roots, checkpoints, and variant flags (IC / crop / varypose) are injected
# by run_eval.py so this YAML only captures the model architecture.

defaults:
  - /dataset@_group_.thuman: thuman
  - override /model/encoder: template_uv_face
  - override /model/encoder/backbone: croco_multi2
  - override /model/decoder: lbs_splatting_cuda
  - override /loss: [mse, lpips, chamfer, projection, lbs_weights, faceloss]

wandb:
  name: eval_nopo_512_face
  tags: [eval, 512x512, face]

model:
  encoder:
    pose_free: true
    intrinsics_embed_loc: encoder
    intrinsics_embed_type: token
    # pretrained_weights only used during training — leave null here
    pretrained_weights: null

    apply_mask: "soft"
    direct_rgbs: false

    backbone:
      template_encoder_free: true
      template_image_size: [512, 512]
      use_ref_mask: true   # SimVS requires this
      intrinsics_embed_loc: "none"
      disable_checkpointing: true

  decoder:
    make_scale_invariant: false
    render_no_canonical: false
    render_no_rgb: false
    render_context: true
    warp_by_shape: true

loss:
  chamfer:
    single_directional: false

  lbs_weights:
    weight: 0.01

  mse:
    apply_mask: true

  faceloss:
    mse:
      weight: 1.0
    lpips:
      weight: 0.1
      apply_after_step: 0
    arcface:
      weight: 0.0

dataset:
  thuman:
    # roots / index_path / background_color injected by run_eval.py
    augment: false
    template_image_shape: [512, 512]
    input_image_shape: [512, 512]
    original_image_shape: [1024, 1024]
    load_template_uv: true
    load_lbs_weights: false
    # variant flags — overridden by run_eval.py per experiment
    load_inconsistent_images: false
    vary_poses: false

    view_sampler:
      num_context_views: 3
      num_target_views: 4
      warm_up_steps: 150_000

optimizer:
  lr: 1e-4
  warm_up_steps: 2000
  backbone_lr_multiplier: 0.1

data_loader:
  train:
    batch_size: 1
    num_workers: 4
  test:
    num_workers: 1

trainer:
  max_steps: 300_001
  val_check_interval: 1000

checkpointing:
  every_n_train_steps: 10000
